<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d9543d" />
    <meta name="description" content="Sin conexión: vuelve a intentarlo cuando recuperes la red." />
    <title>Sin conexión — Ritmo</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #faf6f1;
        color: #2b2118;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        text-align: center;
        padding: 2rem;
        max-width: 26rem;
      }
      h1 {
        color: #d9543d;
        font-size: 1.6rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.5rem;
      }
      button {
        background: #d9543d;
        color: #fff;
        border: 0;
        border-radius: 999px;
        padding: 0.75rem 1.75rem;
        font-size: 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>No hay conexión a internet. Revisa tu red e inténtalo de nuevo.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
