<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d9543d" />
    <meta name="description" content="Planifica y registra tus entrenamientos con bandas." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <title>Ritmo</title>
  </head>
  <body>
    <header class="app-header">
      <p class="eyebrow">ENTRENAMIENTO CON BANDAS</p>
      <h1>Ritmo</h1>
      <p id="header-copy">Tu ciclo semanal, listo para moverse.</p>
    </header>

    <main id="app" tabindex="-1"></main>
    <input id="restore-input" type="file" accept="application/json,.json" hidden />

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button class="nav-button active" data-view="train" aria-label="Entrenar"><span aria-hidden="true">◉</span>Entrenar</button>
      <button class="nav-button" data-view="plan" aria-label="Planificar"><span aria-hidden="true">▦</span>Plan</button>
      <button class="nav-button" data-view="history" aria-label="Historial"><span aria-hidden="true">◷</span>Historial</button>
      <button class="nav-button" data-view="exercises" aria-label="Ejercicios"><span aria-hidden="true">◎</span>Ejercicios</button>
    </nav>

    <dialog id="exercise-dialog">
      <form method="dialog" id="exercise-form">
        <div class="dialog-heading"><h2 id="exercise-dialog-title">Nuevo ejercicio</h2><button class="icon-button" type="button" data-action="close-dialog" aria-label="Cerrar">×</button></div>
        <fieldset>
          <legend>Información básica</legend>
          <label>Nombre<input name="name" required maxlength="70" /></label>
          <label>Grupo muscular<input name="muscle" required maxlength="50" placeholder="Ej.: Espalda" /></label>
          <label>Resumen<textarea name="summary" required rows="3" maxlength="200" placeholder="Idea principal y colocación inicial."></textarea></label>
        </fieldset>
        <fieldset>
          <legend>Guía de ejecución</legend>
          <label>Pasos<textarea name="instructions" required rows="6" placeholder="Un paso por línea.&#10;Posición inicial: ...&#10;Movimiento: ..."></textarea></label>
        </fieldset>
        <fieldset>
          <legend>Técnica y seguridad</legend>
          <label>Detalles técnicos<textarea name="technical" rows="5" placeholder="Un dato por línea.&#10;Músculos principales: ...&#10;Series y repeticiones: ..."></textarea></label>
          <label>Errores a evitar<textarea name="errors" rows="5" placeholder="Un error por línea.&#10;Arquear la espalda: ..."></textarea></label>
        </fieldset>
        <fieldset>
          <legend>Vídeos</legend>
          <label>Enlaces de vídeo<textarea name="videos" rows="4" inputmode="url" placeholder="Una URL por línea.&#10;https://www.youtube.com/watch?v=..."></textarea></label>
        </fieldset>
        <button id="exercise-submit" class="primary-button" type="submit">Añadir ejercicio</button>
      </form>
    </dialog>
    
      <dialog id="guide-dialog" aria-labelledby="guide-exercise-name">
        <section class="guide-dialog-content">
          <div class="dialog-heading"><div><p class="eyebrow">GUÍA DE EJERCICIO</p><h2 id="guide-exercise-name"></h2></div><button class="icon-button" type="button" data-action="stop-guide" aria-label="Cerrar guía">×</button></div>
          <p id="guide-phase" class="guide-phase" aria-live="assertive"></p>
          <p id="guide-countdown" class="guide-countdown" aria-live="off">10</p>
          <p id="guide-cycle" class="guide-cycle"></p>
          <button class="outline-button guide-stop-button" type="button" data-action="stop-guide">Terminar guía</button>
        </section>
      </dialog>

      <dialog id="videos-dialog" aria-labelledby="videos-exercise-name">
        <section class="videos-dialog-content">
          <div class="dialog-heading"><div><p class="eyebrow">VÍDEOS DEL EJERCICIO</p><h2 id="videos-exercise-name"></h2></div><button class="icon-button" type="button" data-action="close-videos" aria-label="Cerrar vídeos">×</button></div>
          <ul id="videos-list" class="videos-list"></ul>
        </section>
      </dialog>

      <dialog id="guide-settings-dialog" aria-labelledby="guide-settings-title">
        <form id="guide-settings-form">
          <div class="dialog-heading"><h2 id="guide-settings-title">Ajustar guía</h2><button class="icon-button" type="button" data-action="close-guide-settings" aria-label="Cerrar">×</button></div>
          <fieldset>
            <legend>Duración de las fases</legend>
            <div class="guide-settings-grid">
              <label>Preparación (segundos)<input name="preparation" type="number" min="1" max="120" required /></label>
              <label>Tensión (segundos)<input name="tension" type="number" min="1" max="60" required /></label>
              <label>Distensión (segundos)<input name="distension" type="number" min="1" max="60" required /></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>Sonido</legend>
            <label>Volumen <output id="guide-volume-value" for="guide-volume"></output><input id="guide-volume" name="volume" type="range" min="0" max="1" step="0.1" /></label>
          </fieldset>
          <button class="primary-button" type="submit">Guardar ajustes</button>
        </form>
      </dialog>

    <div id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
